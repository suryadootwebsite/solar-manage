<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta http-equiv="X-UA-Compatible" content="ie=edge">
  <meta name="theme-color" content="#f97316">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="description" content="Solar Installation Project and Inventory Management System">

  <!-- Content Security Policy (Doc 06 §12) - Strict script-src 'self' without unsafe-inline -->
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; connect-src 'self' https://script.google.com https://script.googleusercontent.com; img-src 'self' data:;">

  <title>Solar Management System</title>

  <!-- PWA Manifest & Icons -->
  <link rel="manifest" href="manifest.json">
  <link rel="icon" type="image/png" sizes="192x192" href="assets/icons/icon-192.png">
  <link rel="apple-touch-icon" href="assets/icons/apple-touch-icon.png">

  <!-- Stylesheets -->
  <link rel="stylesheet" href="css/theme.css">
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/components.css">

  <!-- Application Scripts (defer ensures sequential execution after DOM parsing) -->
  <script src="js/config.js" defer></script>
  <script src="js/auth.js" defer></script>
  <script src="js/i18n.js" defer></script>
  <script src="js/ui.js" defer></script>
  <script src="js/api.js" defer></script>
  <script src="js/pages/ping.js" defer></script>
  <script src="js/pages/login.js" defer></script>
  <script src="js/pages/users.js" defer></script>
  <script src="js/pages/settings.js" defer></script>
  <script src="js/components/master-cache.js" defer></script>
  <script src="js/components/search-select.js" defer></script>
  <script src="js/components/serial-input.js" defer></script>
  <script src="js/pages/customers.js" defer></script>
  <script src="js/pages/masters.js" defer></script>
  <script src="js/pages/lots.js" defer></script>
  <script src="js/pages/stock.js" defer></script>
  <script src="js/pages/transfers.js" defer></script>
  <script src="js/pages/import-stock.js" defer></script>
  <script src="js/pages/sites.js" defer></script>
  <script src="js/pages/site-detail.js" defer></script>
  <script src="js/pages/material-issue.js" defer></script>
  <script src="js/pages/serial-register.js" defer></script>
  <script src="js/pages/money.js" defer></script>
  <script src="js/pages/dashboard.js" defer></script>
  <script src="js/pages/reports.js" defer></script>
  <script src="js/router.js" defer></script>
  <script src="js/app.js" defer></script>
</head>
<body>

  <!-- Top Header Bar -->
  <header class="app-header">
    <div class="brand-wrapper">
      <span class="brand-logo">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="12" cy="12" r="5"></circle>
          <line x1="12" y1="1" x2="12" y2="3"></line>
          <line x1="12" y1="21" x2="12" y2="23"></line>
          <line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line>
          <line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line>
          <line x1="1" y1="12" x2="3" y2="12"></line>
          <line x1="21" y1="12" x2="23" y2="12"></line>
          <line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line>
          <line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line>
        </svg>
        <span id="app-header-title">Solar MS</span>
      </span>
      <span class="brand-badge" id="app-header-tagline">v1.0</span>
      <span id="header-status-dot" class="status-dot" title="Connection status"></span>
      <span class="offline-pill" id="offline-indicator">Offline</span>
    </div>

    <div class="header-actions">
      <button id="lang-toggle-btn" class="lang-btn" aria-label="Toggle language">
        <span id="lang-btn-text">EN</span>
      </button>
    </div>
  </header>

  <!-- Main View Container -->
  <main id="app">
    <div id="main-content">
      <!-- Router mounts views here -->
    </div>
  </main>

  <!-- Bottom Navigation Tab Bar (Mobile First) -->
  <nav class="bottom-nav" id="bottom-nav" aria-label="Main Navigation">
    <a href="#/ping" class="nav-tab active" data-tab="ping">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M22 12h-4l-3 9L9 3l-3 9H2"></path>
      </svg>
      <span class="tab-label" id="tab-label-ping">Ping</span>
    </a>
    <a href="#/sites" class="nav-tab" data-tab="sites">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path>
        <polyline points="9 22 9 12 15 12 15 22"></polyline>
      </svg>
      <span class="tab-label" id="tab-label-sites">Sites</span>
    </a>
    <a href="#/stock" class="nav-tab" data-tab="stock">

        <polyline points="3.27 6.96 12 12.01 20.73 6.96"></polyline>

      </svg>
      <span class="tab-label" id="tab-label-stock">Stock</span>

    <a href="#/dashboard" class="nav-tab" data-tab="dashboard">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <rect x="3" y="3" width="7" height="7"></rect>
        <rect x="14" y="3" width="7" height="7"></rect>
        <rect x="14" y="14" width="7" height="7"></rect>
        <rect x="3" y="14" width="7" height="7"></rect>
      </svg>
      <span class="tab-label" id="tab-label-dashboard">Dashboard</span>
    <a href="#/lots" class="nav-tab" data-tab="lots" style="display:none">

        <line x1="3" y1="6" x2="21" y2="6"></line>
        <path d="M16 10a4 4 0 0 1-8 0"></path>
      </svg>
      <span class="tab-label" id="tab-label-lots">Lots</span>
    </a>
    <a href="#/customers" class="nav-tab" data-tab="customers" style="display:none">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"></path>
        <circle cx="9" cy="7" r="4"></circle>
        <path d="M22 21v-2a4 4 0 0 0-3-3.87"></path>
        <path d="M16 3.13a4 4 0 0 1 0 7.75"></path>
      </svg>
      <span class="tab-label" id="tab-label-customers">Customers</span>
    </a>
    <a href="#/masters" class="nav-tab" data-tab="masters" style="display:none">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <polygon points="12 2 2 7 12 12 22 7 12 2"></polygon>
        <polyline points="2 17 12 22 22 17"></polyline>
        <polyline points="2 12 12 17 22 12"></polyline>
      </svg>
      <span class="tab-label" id="tab-label-masters">Masters</span>
    </a>
    <a href="#/users" class="nav-tab" data-tab="users" style="display:none">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"></path>
        <circle cx="9" cy="7" r="4"></circle>
        <path d="M23 21v-2a4 4 0 0 0-3-3.87"></path>
        <path d="M16 3.13a4 4 0 0 1 0 7.75"></path>
      </svg>
      <span class="tab-label" id="tab-label-users">Users</span>
    </a>
    <a href="#/money" class="nav-tab" data-tab="money" style="display:none">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <line x1="12" y1="1" x2="12" y2="23"></line>
        <path d="M17 5H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6"></path>
      </svg>
      <span class="tab-label" id="tab-label-money">Money</span>
    </a>
    <a href="#/settings" class="nav-tab" data-tab="settings">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="12" cy="12" r="3"></circle>
        <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"></path>

  <!-- Toast Notification Container -->
  <div id="toast-container" aria-live="polite"></div>

  <!-- Modal / Bottom Sheet Backdrop -->
  <div id="modal-backdrop" class="modal-backdrop">
    <div id="bottom-sheet-content" class="bottom-sheet"></div>
  </div>

  <!-- Global Loading Spinner Overlay -->
  <div id="global-spinner-overlay" style="display:none; position:fixed; inset:0; background:rgba(255,255,255,0.7); z-index:9999; align-items:center; justify-content:center;">
    <div class="spinner" style="width:36px; height:36px; border-width:3px; color:var(--brand);"></div>
  </div>

</body>
</html>
