<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta http-equiv="X-UA-Compatible" content="ie=edge">
  <meta name="theme-color" content="#f97316">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="description" content="Solar Installation Project and Inventory Management System">

  <!-- Content Security Policy (Doc 06 §12) - Strict script-src 'self' without unsafe-inline -->
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; connect-src 'self' https://script.google.com https://script.googleusercontent.com; img-src 'self' data:;">

  <title>Suryadoot Energy Solutions</title>

  <!-- PWA Manifest & Icons -->
  <link rel="manifest" href="manifest.json">
  <link rel="icon" type="image/x-icon" href="assets/favicon.ico">
  <link rel="icon" type="image/png" sizes="32x32" href="assets/favicon-32.png">
  <link rel="icon" type="image/png" sizes="192x192" href="assets/icons/icon-192.png">
  <link rel="apple-touch-icon" href="assets/icons/apple-touch-icon.png">

  <!-- Stylesheets -->
  <link rel="stylesheet" href="css/theme.css">
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/components.css">

  <!-- Application Scripts (defer ensures sequential execution after DOM parsing) -->
  <script src="js/config.js" defer></script>
  <script src="js/auth.js" defer></script>
  <script src="js/i18n.js" defer></script>
  <script src="js/ui.js" defer></script>
  <script src="js/api.js" defer></script>
  <script src="js/pages/ping.js" defer></script>
  <script src="js/pages/login.js" defer></script>
  <script src="js/pages/users.js" defer></script>
  <script src="js/pages/settings.js" defer></script>
  <script src="js/components/master-cache.js" defer></script>
  <script src="js/components/search-select.js" defer></script>
  <script src="js/components/serial-input.js" defer></script>
  <script src="js/pages/customers.js" defer></script>
  <script src="js/pages/masters.js" defer></script>
  <script src="js/pages/lots.js" defer></script>
  <script src="js/pages/stock.js" defer></script>
  <script src="js/pages/transfers.js" defer></script>
  <script src="js/pages/import-stock.js" defer></script>
  <script src="js/pages/sites.js" defer></script>
  <script src="js/pages/site-detail.js" defer></script>
  <script src="js/pages/material-issue.js" defer></script>
  <script src="js/pages/serial-register.js" defer></script>
  <script src="js/pages/money.js" defer></script>
  <script src="js/pages/dashboard.js" defer></script>
  <script src="js/pages/reports.js" defer></script>
  <script src="js/router.js" defer></script>
  <script src="js/app.js" defer></script>
</head>
<body>

  <!-- Top Header Bar -->
  <header class="app-header" id="app-header" style="display:none;">
    <div class="brand-wrapper">
      <span class="brand-logo" style="display:inline-flex; align-items:center; gap:0.5rem;">
        <img src="assets/logo-emblem-128.png" alt="Suryadoot Logo" style="height:38px; width:auto; vertical-align:middle; object-fit:contain;" />
        <span id="app-header-title">Suryadoot Energy Solutions</span>
      </span>
      <span class="offline-pill" id="offline-indicator">Offline</span>
    </div>

    <div class="header-actions">
      <button id="lang-toggle-btn" class="lang-btn" aria-label="Toggle language">
        <span id="lang-btn-text">EN</span>
      </button>
      <button id="user-menu-btn" class="user-menu-btn" aria-label="User menu">
        <span id="user-initial">U</span>
      </button>
    </div>
  </header>

  <!-- Main View Container -->
  <main id="app">
    <div id="main-content">
      <!-- Router mounts views here -->
    </div>
  </main>

  <!-- Bottom Navigation Tab Bar (Swipeable, scroll-snap with edge fades) -->
  <div class="bottom-nav-container" id="bottom-nav-container">
    <div class="bottom-nav-wrapper">
      <div class="nav-edge-fade-left" id="nav-fade-left"></div>
      <div class="nav-edge-fade-right" id="nav-fade-right"></div>
      <nav class="bottom-nav" id="bottom-nav" aria-label="Main Navigation">
        <!-- 1. Dashboard -->
        <a href="#/dashboard" class="nav-tab" data-tab="dashboard">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <rect x="3" y="3" width="7" height="7"></rect>
            <rect x="14" y="3" width="7" height="7"></rect>
            <rect x="14" y="14" width="7" height="7"></rect>
            <rect x="3" y="14" width="7" height="7"></rect>
          </svg>
          <span class="tab-label" id="tab-label-dashboard">Dashboard</span>
        </a>
        <!-- 2. Sites -->
        <a href="#/sites" class="nav-tab active" data-tab="sites">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path>
            <polyline points="9 22 9 12 15 12 15 22"></polyline>
          </svg>
          <span class="tab-label" id="tab-label-sites">Sites</span>
        </a>
        <!-- 3. Stock -->
        <a href="#/stock" class="nav-tab" data-tab="stock">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16z"></path>
            <polyline points="3.27 6.96 12 12.01 20.73 6.96"></polyline>
            <line x1="12" y1="22.08" x2="12" y2="12"></line>
          </svg>
          <span class="tab-label" id="tab-label-stock">Stock</span>
        </a>
        <!-- 4. Purchase (Lots) -->
        <a href="#/lots" class="nav-tab" data-tab="lots">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M6 2L3 6v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V6l-3-4z"></path>
            <line x1="3" y1="6" x2="21" y2="6"></line>
            <path d="M16 10a4 4 0 0 1-8 0"></path>
          </svg>
          <span class="tab-label" id="tab-label-lots">Purchase</span>
        </a>
        <!-- 5. Customers -->
        <a href="#/customers" class="nav-tab" data-tab="customers">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"></path>
            <circle cx="9" cy="7" r="4"></circle>
            <path d="M22 21v-2a4 4 0 0 0-3-3.87"></path>
            <path d="M16 3.13a4 4 0 0 1 0 7.75"></path>
          </svg>
          <span class="tab-label" id="tab-label-customers">Customers</span>
        </a>
        <!-- 6. Masters -->
        <a href="#/masters" class="nav-tab" data-tab="masters">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <polygon points="12 2 2 7 12 12 22 7 12 2"></polygon>
            <polyline points="2 17 12 22 22 17"></polyline>
            <polyline points="2 12 12 17 22 12"></polyline>
          </svg>
          <span class="tab-label" id="tab-label-masters">Masters</span>
        </a>
        <!-- 7. Money -->
        <a href="#/money" class="nav-tab" data-tab="money">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <line x1="12" y1="1" x2="12" y2="23"></line>
            <path d="M17 5H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6"></path>
          </svg>
          <span class="tab-label" id="tab-label-money">Money</span>
        </a>
        <!-- 8. Reports -->
        <a href="#/reports" class="nav-tab" data-tab="reports">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <line x1="18" y1="20" x2="18" y2="10"></line>
            <line x1="12" y1="20" x2="12" y2="4"></line>
            <line x1="6" y1="20" x2="6" y2="14"></line>
          </svg>
          <span class="tab-label" id="tab-label-reports">Reports</span>
        </a>
        <!-- 9. Users -->
        <a href="#/users" class="nav-tab" data-tab="users">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"></path>
            <circle cx="9" cy="7" r="4"></circle>
            <path d="M23 21v-2a4 4 0 0 0-3-3.87"></path>
            <path d="M16 3.13a4 4 0 0 1 0 7.75"></path>
          </svg>
          <span class="tab-label" id="tab-label-users">Users</span>
        </a>
        <!-- 10. Settings -->
        <a href="#/settings" class="nav-tab" data-tab="settings">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="12" cy="12" r="3"></circle>
            <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"></path>
          </svg>
          <span class="tab-label" id="tab-label-settings">Settings</span>
        </a>
      </nav>
    </div>
  </div>

  <!-- Toast Notification Container -->
  <div id="toast-container" aria-live="polite"></div>

  <!-- Modal / Bottom Sheet Backdrop -->
  <div id="modal-backdrop" class="modal-backdrop">
    <div id="bottom-sheet-content" class="bottom-sheet"></div>
  </div>

  <!-- Global Loading Spinner Overlay -->
  <div id="global-spinner-overlay" style="display:none; position:fixed; inset:0; background:rgba(255,255,255,0.7); z-index:9999; align-items:center; justify-content:center;">
    <div class="spinner" style="width:36px; height:36px; border-width:3px; color:var(--brand);"></div>
  </div>

</body>
</html>
