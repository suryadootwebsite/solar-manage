<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta http-equiv="X-UA-Compatible" content="ie=edge">
  <meta name="theme-color" content="#f97316">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="description" content="Solar Installation Project and Inventory Management System">

  <!-- Content Security Policy (Doc 06 §12) - Strict script-src 'self' without unsafe-inline -->
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; connect-src 'self' https://script.google.com https://script.googleusercontent.com; img-src 'self' data:;">

  <title>Suryadoot Energy Solutions</title>

  <!-- PWA Manifest & Icons -->
  <link rel="manifest" href="manifest.json">
  <link rel="icon" type="image/x-icon" href="assets/favicon.ico">
  <link rel="icon" type="image/png" sizes="32x32" href="assets/favicon-32.png">
  <link rel="icon" type="image/png" sizes="192x192" href="assets/icons/icon-192.png">
  <link rel="apple-touch-icon" href="assets/icons/apple-touch-icon.png">

  <!-- Stylesheets -->
  <link rel="stylesheet" href="css/theme.css">
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/components.css">

  <!-- Application Scripts (defer ensures sequential execution after DOM parsing) -->
  <script src="js/config.js" defer></script>
  <script src="js/auth.js" defer></script>
  <script src="js/i18n.js" defer></script>
  <script src="js/ui.js" defer></script>
  <script src="js/api.js" defer></script>
  <script src="js/pages/ping.js" defer></script>
  <script src="js/pages/login.js" defer></script>
  <script src="js/pages/users.js" defer></script>
  <script src="js/pages/settings.js" defer></script>
  <script src="js/components/master-cache.js" defer></script>
  <script src="js/components/search-select.js" defer></script>
  <script src="js/components/serial-input.js" defer></script>
  <script src="js/pages/customers.js" defer></script>
  <script src="js/pages/masters.js" defer></script>
  <script src="js/pages/lots.js" defer></script>
  <script src="js/pages/stock.js" defer></script>
  <script src="js/pages/transfers.js" defer></script>
  <script src="js/pages/import-stock.js" defer></script>
  <script src="js/pages/sites.js" defer></script>
  <script src="js/pages/site-detail.js" defer></script>
  <script src="js/pages/material-issue.js" defer></script>
  <script src="js/pages/serial-register.js" defer></script>
  <script src="js/pages/money.js" defer></script>
  <script src="js/pages/dashboard.js" defer></script>
  <script src="js/pages/reports.js" defer></script>
  <script src="js/router.js" defer></script>
  <script src="js/app.js" defer></script>
</head>
<body>

  <!-- Top Header Bar -->
  <header class="app-header" id="app-header" style="display:none;">
    <div class="brand-wrapper">
      <span class="brand-logo" style="display:inline-flex; align-items:center; gap:0.5rem;">
        <img src="assets/logo-emblem-128.png" alt="Suryadoot Logo" style="height:38px; width:auto; vertical-align:middle; object-fit:contain;" />
        <span id="app-header-title">Suryadoot Energy Solutions</span>
      </span>
      <span class="offline-pill" id="offline-indicator">Offline</span>
    </div>

    <div class="header-actions">
      <button id="lang-toggle-btn" class="lang-btn" aria-label="Toggle language">
        <span id="lang-btn-text">EN</span>
      </button>
    </div>
  </header>

  <!-- Main View Container -->
  <main id="app">
    <div id="main-content">
      <!-- Router mounts views here -->
    </div>
  </main>

  <!-- Bottom Navigation Tab Bar (Mobile First) -->
  <nav class="bottom-nav" id="bottom-nav" aria-label="Main Navigation" style="display:none;">
    <a href="#/dashboard" class="nav-tab" data-tab="dashboard">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <rect x="3" y="3" width="7" height="7"></rect>
        <rect x="14" y="3" width="7" height="7"></rect>
        <rect x="14" y="14" width="7" height="7"></rect>
        <rect x="3" y="14" width="7" height="7"></rect>
      </svg>
      <span class="tab-label" id="tab-label-dashboard">Dashboard</span>
    </a>
    <a href="#/sites" class="nav-tab active" data-tab="sites">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path>
        <polyline points="9 22 9 12 15 12 15 22"></polyline>
      </svg>
      <span class="tab-label" id="tab-label-sites">Sites</span>
    </a>
    <a href="#/stock" class="nav-tab" data-tab="stock">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16z"></path>
        <polyline points="3.27 6.96 12 12.01 20.73 6.96"></polyline>
        <line x1="12" y1="22.08" x2="12" y2="12"></line>
      </svg>
      <span class="tab-label" id="tab-label-stock">Stock</span>
    </a>
    <a href="#/lots" class="nav-tab" data-tab="lots">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M6 2L3 6v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V6l-3-4z"></path>
        <line x1="3" y1="6" x2="21" y2="6"></line>
        <path d="M16 10a4 4 0 0 1-8 0"></path>
      </svg>
      <span class="tab-label" id="tab-label-lots">Purchase</span>
    </a>
    <button type="button" class="nav-tab" id="nav-more-btn" aria-label="More navigation options">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="12" cy="12" r="2"></circle>
        <circle cx="19" cy="12" r="2"></circle>
        <circle cx="5" cy="2" r="2"></circle>
      </svg>
      <span class="tab-label" id="tab-label-more">More</span>
    </button>
  </nav>

  <!-- Toast Notification Container -->
  <div id="toast-container" aria-live="polite"></div>

  <!-- Modal / Bottom Sheet Backdrop -->
  <div id="modal-backdrop" class="modal-backdrop">
    <div id="bottom-sheet-content" class="bottom-sheet"></div>
  </div>

  <!-- Global Loading Spinner Overlay -->
  <div id="global-spinner-overlay" style="display:none; position:fixed; inset:0; background:rgba(255,255,255,0.7); z-index:9999; align-items:center; justify-content:center;">
    <div class="spinner" style="width:36px; height:36px; border-width:3px; color:var(--brand);"></div>
  </div>

</body>
</html>
